<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<title>CRUD - Letras de Músicas</title>
		<!-- Material Pieces -->
        <link rel="stylesheet" href="src/css/pieces/pieces.css">
        <script src="src/js/pieces/pieces.js"></script>
		<style>
			body {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 1px;
				font-family: sans-serif;
				height: 100vh;
			}

			#lista {
				display: grid;
				height: 100vh;
				overflow: auto;
				gap: 1px;

				.card-list {
					display: grid;
					padding: 16px;
					grid-template-columns: auto 1fr;
					place-content: center;
					gap: 0 16px;
					align-items: center;
					user-select: none;
					grid-template-areas:
						'numero nome'
						'numero cantor'
					;
					.numero {
						grid-area: numero;
						width: 48px;
						height: 48px;
						display: grid;
						place-items: center;
						border-radius: 16px;
						aspect-ratio: 1/1;
						font-weight: 900;
					}
					.nome {
						grid-area: nome;
						font-size: 12px;
						border-radius: 4px;
						text-align: start;
						font-weight: 900;
					}
					.cantor {
						grid-area: cantor;
						font-size: 12px;
						border-radius: 4px;
						text-align: start;
					}
					&>:where(.numero, .nome):nth-child(-n+15) {
						animation: list .6s ease-in-out;
					}
					div {
						position: absolute;
						inset: 0;
						margin: auto 16px auto auto;
						display: grid;
						grid-template-columns: auto auto;
						place-content: center end;
						gap: 4px;
					}
				}
			}

			#cadastro {
				display: grid;
				grid-template-rows: auto auto 1fr auto auto;
				height: 100vh;
				padding: 16px;
				gap: 16px;

				&>label {
					display: grid;
					grid-template-columns: 1fr auto;
					align-items: center;
					font-weight: 700;
					cursor: var(--cursor-pointer);
				}
			}

			textarea {
				width: 100%;
				height: 100%;
				font-size: 16px;
				padding: 16px;
				position: relative;
				z-index: 1;
			}

			#preview {
				display: grid;
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				overflow-y: auto;
				padding: 16px;
				position: absolute;
				pointer-events: none;
				user-select: none;

				.bloco {
					display: grid;
					position: relative;
					--font-size: 1;
					gap: 12px;
					
					* {color: transparent;}

					&>header {

						display: grid;
						grid-auto-flow: column;
						gap: 1px;
						place-content: start;
						position: sticky;
						z-index: 1;
						top: 0;
						place-content: center start;

						&>:nth-child(1) {
							font-size: 16px;
							display: grid;
							place-items: center;
						}
						&>span {
							font-size: 16px;
							display: grid;
							place-items: center;
						}
					}
					&>main {
						display: grid;
						gap: 1px;

						input {display: none;}

						label{
							--piece-s: 48%;
							font-size: 16px;
						}
					}

					.marcador-aspect-radio-1-1 {aspect-ratio: 1/1;}


					/* ministracao / .declamação */
					&:has(.marcador-ministracao, .marcador-declamacao) :where(.marcador-ministracao, .marcador-declamacao),
					&:has(.marcador-ministracao, .marcador-declamacao) label {
						--piece-h: 100;
						font-weight: 900;
					}

					.marcador-dpto {--piece-h: 261;}
					.marcador-solo {--piece-h: 48; text-decoration: underline;}
					.marcador-s {--piece-h: 48; text-decoration: underline;}
					.marcador-masculino {--piece-h: 180;}
					.marcador-m {--piece-h: 180;}
					.marcador-feminino {--piece-h: 300;}
					.marcador-f {--piece-h: 300;}

					.marcador-solomasculino {
						text-decoration: underline;
						--piece-h: 180;
					}
					.marcador-solofeminino {
						text-decoration: underline;
						--piece-h: 300;
					}
				}
			}
		</style>

		<script type="module">
			// Import Firebase
		import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
		import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

		const firebaseConfig = {
		apiKey: "AIzaSyB2Gkim-k9GNZk02t414bZcPSO-z7QlzDE",
		authDomain: "yahweh-shammah-74033.firebaseapp.com",
		projectId: "yahweh-shammah-74033",
		storageBucket: "yahweh-shammah-74033.appspot.com",
		messagingSenderId: "1090658649746",
		appId: "1:1090658649746:web:927ffb00842f52d7d2084b"
		};

		const app = initializeApp(firebaseConfig);
		const db = getFirestore(app);
		const letrasRef = collection(db, "letras");

		// ---------- FUNÇÕES DE RENDERIZAÇÃO ----------
		function normalizarMarcador(m) {
		return m
			.normalize("NFD")
			.replace(/[\u0300-\u036f]/g, "")
			.replace(/[^a-zA-Z0-9]/g, "")
			.toLowerCase();
		}

		function renderizarLetra(letra) {
		const saida = document.getElementById("preview");
		saida.innerHTML = "";

		if (!letra) return;

		const blocos = letra.trim().split(/\n\s*\n/);

		blocos.forEach((bloco, i) => {
			const div = document.createElement("div");
			div.className = "bloco";

			const header = document.createElement("header");
			header.innerHTML = `<span>[${i + 1}]</span>`;
			const marcadoresSet = new Set();

			const marcadores = [...bloco.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);

			marcadores.forEach(m => {
			const norm = normalizarMarcador(m);
			if (!marcadoresSet.has(norm)) {
				const span = document.createElement("span");
				span.textContent = m;
				span.className = "marcador-" + norm;
				header.appendChild(span);
				marcadoresSet.add(norm);
			}
			});

			const main = document.createElement("main");
			const marcadorPrincipal = marcadores.length > 0 ? marcadores[0] : null;

			bloco.split("\n").forEach(linha => {
			if (linha.trim()) {
				const marcadoresLinha = [...linha.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
				let linhaLimpa = linha.replace(/\[([^\]]+)\]/g, "").trim();

				if (linhaLimpa) {
				const label = document.createElement("label");
				label.classList = `
					piece-surface
					background-color-auto-04
					background-color-auto-06-active
					piece-40
				`
				label.innerHTML = `
					<span>${linhaLimpa}</span>
					<input type="radio" name="letra-preview">
				`;

				if (marcadoresLinha.length > 0) {
					marcadoresLinha.forEach(m => label.classList.add("marcador-" + normalizarMarcador(m)));
				} else if (marcadorPrincipal) {
					label.classList.add("marcador-" + normalizarMarcador(marcadorPrincipal));
				}

				main.appendChild(label);
				}
			}
			});

			div.appendChild(header);
			div.appendChild(main);
			saida.appendChild(div);
		});
		}

		// ---------- CRUD ----------
		async function listarLetras() {
		const querySnapshot = await getDocs(letrasRef);
		const lista = document.getElementById("lista");
		lista.innerHTML = "";

		const docsArray = querySnapshot.docs.map(doc => ({
			id: doc.id,
			...doc.data()
		}));

		docsArray.sort((a, b) => a.nome.localeCompare(b.nome));

		docsArray.forEach((data, i) => {
			const item = document.createElement("li");
			item.classList = "piece-surface background-color-auto-02 card-list"
			item.innerHTML = `
			<span class="numero piece-surface background-color-auto-06 text-color-auto-20 piece-tertiary piece-s-40">${i+1}</span>
			<span class="nome">${data.nome}</span>
			<span class="cantor">${data.cantor}</span>
			<div>
				<button
					onclick="editar('${data.id}', '${data.nome}', '${data.cantor}', \`${data.letra}\`, ${data.festividade})"
					class="
						piece-icon-button
						piece-small
						piece-narrow
						piece-surface
						piece-s-40
						background-color-auto-11
						background-color-auto-18-active
						background-color-auto-12-hover
						background-color-auto-19-hover-active
						text-color-auto-00
						text-color-auto-02-active
						ripple-color-inverse-00
						ripple-color-inverse-25-active
						piece-secondary
					">
					<span class="material-symbols-rounded piece-icon piece-false" translate="no">edit</span>
					<span class="piece-tooltip piece-surface background-color-inverse-00 text-color-inverse-25 bottom hover piece-false">Editar</span>
					<span class="piece-ripple"></span>
				</button>
				<button
					onclick="excluir('${data.id}')"
					class="
						piece-icon-button
						piece-small
						piece-narrow
						piece-surface
						piece-s-40
						background-color-auto-11
						background-color-auto-18-active
						background-color-auto-12-hover
						background-color-auto-19-hover-active
						text-color-auto-00
						text-color-auto-02-active
						ripple-color-inverse-00
						ripple-color-inverse-25-active
						piece-tertiary
					">
					<span class="material-symbols-rounded piece-icon piece-false" translate="no">delete</span>
					<span class="piece-tooltip piece-surface background-color-inverse-00 text-color-inverse-25 bottom hover piece-false">Excluir</span>
					<span class="piece-ripple"></span>
				</button>
			</div>
			`;
			lista.appendChild(item);
		});
		}

		async function salvar() {
		const nome = document.getElementById("nome").value.trim();
		const cantor = document.getElementById("cantor").value.trim();
		const letra = document.getElementById("letra").value.trim();
		const festividade = document.getElementById("festividade").checked;

		if (!nome || !cantor || !letra) return alert("Preencha todos os campos.");

		const q = query(letrasRef, where("nome", "==", nome), where("cantor", "==", cantor));
		const snap = await getDocs(q);

		if (!snap.empty) {
			if (!confirm("Já existe uma letra com este nome e cantor. Deseja criar mesmo assim?")) return;
		}

		await addDoc(letrasRef, { nome, cantor, letra, festividade });
		alert("Letra adicionada.");
		listarLetras();
		limparFormulario();
		}

		window.editar = (id, nome, cantor, letra, festividade) => {
		document.getElementById("id").value = id;
		document.getElementById("nome").value = nome;
		document.getElementById("cantor").value = cantor;
		document.getElementById("letra").value = letra;
		document.getElementById("festividade").checked = festividade;
		document.getElementById("salvar").style.display = "none";
		document.getElementById("atualizar").style.display = "grid";

		// renderiza preview assim que abrir
		renderizarLetra(letra);
		};

		async function atualizar() {
		const id = document.getElementById("id").value;
		const docRef = doc(db, "letras", id);

		const nome = document.getElementById("nome").value.trim();
		const cantor = document.getElementById("cantor").value.trim();
		const letra = document.getElementById("letra").value.trim();
		const festividade = document.getElementById("festividade").checked;

		await updateDoc(docRef, { nome, cantor, letra, festividade });
		alert("Letra atualizada.");
		listarLetras();
		limparFormulario();
		}

		window.excluir = async (id) => {
		if (confirm("Deseja realmente excluir esta letra?")) {
			await deleteDoc(doc(db, "letras", id));
			alert("Letra excluída.");
			listarLetras();
		}
		};

		function limparFormulario() {
		document.getElementById("id").value = "";
		document.getElementById("nome").value = "";
		document.getElementById("cantor").value = "";
		document.getElementById("letra").value = "";
		document.getElementById("festividade").checked = false;
		document.getElementById("salvar").style.display = "grid";
		document.getElementById("atualizar").style.display = "grid";
		document.getElementById("preview").innerHTML = "";
		}

		// ---------- SYNC SCROLL ----------
		function syncScroll(el1, el2) {
		let active = false;
		el1.addEventListener("scroll", () => {
			if (!active) {
			active = true;
			el2.scrollTop = (el1.scrollTop / el1.scrollHeight) * el2.scrollHeight;
			active = false;
			}
		});

		}

		window.onload = () => {
		listarLetras();
		const textarea = document.getElementById("letra");
		const preview = document.getElementById("preview");

		textarea.addEventListener("input", () => renderizarLetra(textarea.value));

		syncScroll(textarea, preview);
		};

		window.salvar = salvar;
		window.atualizar = atualizar;
	</script>
	</head>
	<body style="--piece-s: 16%; --piece-h: 21;" class="piece-light piece-triade piece-surface background-color-auto-06 text-color-auto-21">
		<!-- Coluna 1 -->
		<ul id="lista" class="piece-surface background-color-auto-06"></ul>

		<!-- Coluna 2 -->
		<div id="cadastro" class="piece-surface background-color-auto-02">
			<input type="hidden" id="id">
			<div class="piece-text-field">
				<label class="
					piece-surface
					border-color-auto-06
					border-color-auto-20-active
				">
					<input id="nome" type="text" class="piece-controller" required="">
					<span class="piece-label">Nome da música</span>
					<span class="piece-ripple"></span>
				</label>
			</div>
			<div class="piece-text-field">
				<label class="
					piece-surface
					border-color-auto-06
					border-color-auto-20-active
				">
					<input id="cantor" type="text" class="piece-controller" required="">
					<span class="piece-label">Cantor</span>
					<span class="piece-ripple"></span>
				</label>
			</div>
			<div class="piece-textarea">
				<label class="
					piece-surface
					background-color-auto-02
					border-color-auto-12
				">
					<textarea id="letra" class="surface-controller" placeholder="Letra da música"></textarea>
					<div id="preview" class="piece-surface background-color-auto-02"></div>
				</label>
			</div>
			<label>
				Festividade
				<div class="
					piece-switch
					piece-surface

					background-color-auto-00
					background-color-auto-02-hover

					background-color-auto-12-active
					background-color-auto-14-active-hover


					border-color-auto-04
					border-color-auto-10-active
					
					ripple-to-fg
					ripple-to-accent-active
				">
					<span class="piece-ripple"></span>
					<input id="festividade" type="checkbox" class="piece-controller">
					<span class="
						piece-indicator
						piece-surface
						piece-parent
						background-color-auto-12
						background-color-auto-00-active
					"></span>
				</div>
			</label>
			<button id="salvar" onclick="salvar()" class="piece-surface piece-button piece-medium background-color-auto-11 background-color-auto-12-hover text-color-dark-00 ripple-color-auto-00">
				<span class="material-symbols-rounded piece-icon" translate="no">save</span>
				<span class="piece-label">Salvar</span>
				<span class="piece-ripple"></span>
			</button>
			<button  id="atualizar" onclick="atualizar()" style="display:none;" class="piece-surface piece-button piece-medium background-color-auto-11 background-color-auto-12-hover text-color-dark-00 ripple-color-auto-00">
				<span class="material-symbols-rounded piece-icon" translate="no">save</span>
				<span class="piece-label">Atualizar</span>
				<span class="piece-ripple"></span>
			</button>
		</div>

		<!-- Coluna 3 -->
		
	</body>
</html>
